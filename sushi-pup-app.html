function FoodArt({ food, size }) {
  if (food.img) {
    return (
      <img
        src={food.img}
        alt={food.name}
        draggable={false}
        style={{ width: size, height: size, objectFit: "contain", borderRadius: "50%" }}
      />
    );
  }
  return <svg viewBox="0 0 100 100" width={size} height={size}>{FOOD_DEFS}{food.render}</svg>;
}

function PhotoDog({ mood = "idle", size = 210 }) {
  const cls = { idle: "sd-p-breathe", focus: "sd-p-focus", like: "sd-p-like", dislike: "sd-p-dislike", celebrate: "sd-p-bounce" }[mood] || "sd-p-breathe";
  return (
    <div className="relative" style={{ width: size, height: size }}>
      <div className="absolute rounded-full" style={{ width: size * 0.7, height: size * 0.13, left: "50%", bottom: size * 0.04, transform: "translateX(-50%)", background: "radial-gradient(closest-side, rgba(190,160,120,0.28), transparent 78%)", filter: "blur(3px)" }} />
      <img src={DOG_IMG[mood] || DOG_IMG.idle} alt="SushiPuppy" draggable={false} className={cls} style={{ width: "100%", height: "100%", objectFit: "contain", position: "relative", filter: "drop-shadow(0 8px 10px rgba(150,115,70,0.16))" }} />
    </div>
  );
}

function ClayShell({ size, radius, children, front = true, style }) {
  return (
    <div style={{ width: size, height: size, borderRadius: radius, background: `linear-gradient(160deg, #FFFDF8 0%, ${RICE} 52%, #F0E4CC 100%)`, border: "1px solid #EEE1C6", boxShadow: front ? "inset 0 1.5px 0 rgba(255,255,255,0.9), 0 20px 36px rgba(150,115,70,0.22), 0 3px 8px rgba(150,115,70,0.13)" : "inset 0 1px 0 rgba(255,255,255,0.7), 0 8px 16px rgba(150,115,70,0.15)", display: "flex", alignItems: "center", justifyContent: "center", position: "relative", overflow: "hidden", ...style }}>

      {children}

function Particle({ i }) {
  const angle = (i / 10) * Math.PI * 2;
  const dist = 64 + (i % 3) * 18;
  return <div className="absolute rounded-full sd-particle" style={{ width: 7, height: 7, left: "50%", top: "50%", background: i % 2 === 0 ? SALMON : "#EAD9A0", "--tx": `${Math.cos(angle) * dist}px`, "--ty": `${Math.sin(angle) * dist}px`, animationDelay: `${i * 30}ms` }} />;
}

const CARD_SIZE = 206;

function DeckCard({ food, isFront, offset, onSkip, onChoose, onFocusStart, onFocusEnd, onDragState }) {
  const ref = useRef(null);
  const [drag, setDrag] = useState({ active: false, dx: 0, dy: 0 });
  const startRef = useRef({ x: 0, y: 0 });
  const pressTimer = useRef(null);
  const longPressed = useRef(false);

  const onPointerDown = (e) => {
    if (!isFront) return;
    ref.current?.setPointerCapture?.(e.pointerId);
    startRef.current = { x: e.clientX, y: e.clientY };
    setDrag({ active: true, dx: 0, dy: 0 });
    longPressed.current = false;
    pressTimer.current = setTimeout(() => { longPressed.current = true; onFocusStart(); }, 480);
  };
  const onPointerMove = (e) => {
    if (!drag.active) return;
    const dx = e.clientX - startRef.current.x;
    const dy = e.clientY - startRef.current.y;
    if (Math.abs(dx) > 10 || Math.abs(dy) > 10) {
      clearTimeout(pressTimer.current);
      if (longPressed.current) { longPressed.current = false; onFocusEnd(); }
    }
    setDrag({ active: true, dx, dy });
    onDragState(dx);
  };
  const onPointerUp = () => {
    clearTimeout(pressTimer.current);
    if (longPressed.current) onFocusEnd();
    if (!drag.active) return;
    const { dx } = drag;
    if (dx < -100) onSkip(food);
    else if (dx > 100) onChoose(food);
    setDrag({ active: false, dx: 0, dy: 0 });
    onDragState(0);
  };

  const dragT = drag.active ? `translate(${drag.dx}px, ${drag.dy * 0.4}px) rotate(${drag.dx / 16}deg)` : "";
  const baseT = isFront ? "translate(0,0) rotate(0deg) scale(1)" : `translate(${offset.x}px, ${offset.y}px) rotate(${offset.rot}deg) scale(${offset.scale})`;
  const dragTint = isFront && drag.active ? (drag.dx > 30 ? `rgba(143,174,99,${Math.min(0.28, drag.dx / 400)})` : drag.dx < -30 ? `rgba(180,120,110,${Math.min(0.24, -drag.dx / 450)})` : "transparent") : "transparent";

  return (
    <div ref={ref} onPointerDown={onPointerDown} onPointerMove={onPointerMove} onPointerUp={onPointerUp} className="absolute left-1/2 top-0 select-none" style={{ marginLeft: -(CARD_SIZE / 2), transform: `${baseT} ${dragT}`, transition: drag.active ? "none" : "transform 380ms cubic-bezier(.22,1,.36,1)", zIndex: isFront ? 10 : offset.z, touchAction: "none" }}>
      <div className={isFront ? "cursor-grab active:cursor-grabbing" : ""}>
        <ClayShell size={CARD_SIZE} radius={36} front={isFront}>
          <FoodArt food={food} size={CARD_SIZE * 0.62} />
          <div style={{ position: "absolute", inset: 0, borderRadius: 36, background: dragTint, transition: drag.active ? "none" : "background 250ms ease", pointerEvents: "none" }} />
          <div className="absolute rounded-full flex items-center justify-center" style={{ right: -8, bottom: -8, width: 30, height: 30, background: food.badgeColor, fontSize: 14, boxShadow: "0 4px 10px rgba(150,115,70,0.25)", border: `2px solid ${RICE}` }}>{food.badge}</div>
        </ClayShell>
      </div>
      {isFront && (
        <div className="mt-2.5 text-center" style={{ fontFamily: "'Poppins', sans-serif" }}>
          <div style={{ color: INK, fontSize: 15, fontWeight: 600 }}>{food.name}</div>
        </div>
      )}
    </div>
  );
}

function SushiDogApp() {
  const [screen, setScreen] = useState("opening");
  const [progress, setProgress] = useState(0);
  const [queue, setQueue] = useState(FOODS);
  const [mood, setMood] = useState("idle");
  const [selected, setSelected] = useState(null);
  const [likeLevel, setLikeLevel] = useState(4);
  const [dragDx, setDragDx] = useState(0);
  const idleTimer = useRef(null);

  useEffect(() => {
    if (screen !== "opening") return;
    setProgress(0);
    const start = Date.now();
    const dur = 2200;
    const id = setInterval(() => {
      const p = Math.min(100, Math.round(((Date.now() - start) / dur) * 100));
      setProgress(p);
      if (p >= 100) clearInterval(id);
    }, 60);
    return () => clearInterval(id);
  }, [screen]);

  const resetIdleTimer = useCallback(() => {
    clearTimeout(idleTimer.current);
    idleTimer.current = setTimeout(() => setMood("focus"), 6000);
  }, []);

  useEffect(() => {
    if (screen !== "home") return;
    setMood("idle");
    resetIdleTimer();
    return () => clearTimeout(idleTimer.current);
    // eslint-disable-next-line react-hooks/exhaustive-deps
  }, [screen]);

  const handleDrag = (dx) => { setDragDx(dx); resetIdleTimer(); };
  const handleFocusStart = () => { setMood("focus"); resetIdleTimer(); };
  const handleFocusEnd = () => setMood("idle");

  const handleSkip = (food) => {
    setMood("dislike");
    setTimeout(() => setMood("idle"), 600);
    setQueue((q) => [...q.filter((f) => f.id !== food.id), food]);
    resetIdleTimer();
  };

  const handleChoose = (food) => {
    clearTimeout(idleTimer.current);
    setMood("like");
    setLikeLevel(3 + Math.round(Math.random() * 2));
    setSelected(food);
    setTimeout(() => { setMood("focus"); setScreen("focusFood"); }, 500);
    setTimeout(() => { setMood("like"); setScreen("chooseFood"); }, 1900);
  };

  const confirm = () => { setMood("celebrate"); setScreen("result"); };

  const restart = () => {
    setSelected(null);
    setMood("idle");
    setQueue(FOODS);
    setScreen("opening");
  };

  const front = queue[0];
  const behind = queue.slice(1, 4);
  const offsets = [
    { x: -46, y: 14, rot: -9, scale: 0.93, z: 3 },
    { x: 46, y: 18, rot: 9, scale: 0.9, z: 2 },
    { x: 0, y: 30, rot: 0, scale: 0.86, z: 1 },
  ];
  const hint = dragDx < -30 ? "Oh, maybe next time!" : dragDx > 30 ? "Happy & excited! Tail wags!" : "Hold to focus · swipe left/right to decide";

  return (
    <div className="w-full min-h-[860px] flex items-center justify-center p-6" style={{ background: BG }}>
      <style>{`
        @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap');
        .sd-p-breathe { animation: pBreathe 3.8s ease-in-out infinite; }
        @keyframes pBreathe { 0%,100% { transform: scale(1); } 50% { transform: scale(1.018); } }
        .sd-p-focus { animation: pFocus 1.4s ease-in-out infinite; }
        @keyframes pFocus { 0%,100% { transform: scale(1.02) rotate(-1deg); } 50% { transform: scale(1.035) rotate(1deg); } }
        .sd-p-like { animation: pLike 0.42s ease-in-out infinite; }
        @keyframes pLike { 0%,100% { transform: translateY(0) rotate(-1.5deg) scale(1.01); } 50% { transform: translateY(-7px) rotate(1.5deg) scale(1.04); } }
        .sd-p-dislike { animation: pDislike 0.55s ease-in-out; }
        @keyframes pDislike { 0% { transform: translateY(0) rotate(0deg); } 40% { transform: translateY(6px) rotate(-2deg); } 100% { transform: translateY(0) rotate(0deg); } }
        .sd-p-bounce { animation: pBounce 0.6s ease-in-out infinite; }
        @keyframes pBounce { 0%,100% { transform: translateY(0) scale(1.02); } 50% { transform: translateY(-9px) scale(1.06); } }
        .sd-particle { animation: sdParticle 950ms ease-out forwards; }
        @keyframes sdParticle { 0% { transform: translate(0,0) scale(0.6); opacity:1; } 100% { transform: translate(var(--tx), var(--ty)) scale(0.2); opacity:0; } }
        .sd-fade { animation: sdFade 380ms ease-out; }
        @keyframes sdFade { from { opacity:0; transform: translateY(8px);} to { opacity:1; transform: translateY(0);} }
      `}</style>

      <div className="relative w-full max-w-[420px] rounded-[40px] overflow-hidden" style={{ height: 860, background: `radial-gradient(120% 90% at 50% 0%, ${RICE} 0%, ${BG} 55%, #EFE2C7 100%)`, boxShadow: "0 30px 60px rgba(120,90,60,0.16)", border: "1px solid #EFE2C6" }}>

        {screen === "opening" && (
          <div className="sd-fade flex flex-col items-center h-full pb-10 px-8">
            <div className="w-full mt-4 flex items-center gap-1.5">
              <span style={{ fontFamily: "'Poppins', sans-serif", fontWeight: 800, fontSize: 32, color: INK }}>SushiPuppy</span>
              <Paw size={17} />
            </div>
            <div className="w-full text-[15px] mt-2 leading-snug" style={{ color: MUTE, fontFamily: "'Poppins', sans-serif" }}>Let SushiPuppy decide<br />what we eat today?</div>
            <div className="mt-8 flex-1 flex items-center"><PhotoDog mood="idle" size={300} /></div>
            <div className="w-full">
              <div className="w-full h-1.5 rounded-full overflow-hidden" style={{ background: "#EEE1C6" }}>
                <div className="h-1.5 rounded-full" style={{ width: `${progress}%`, background: SALMON, transition: "width 80ms linear" }} />
              </div>
              <div className="text-[10px] mt-1 text-right" style={{ color: MUTE, fontFamily: "'Poppins', sans-serif" }}>{progress < 100 ? `${progress}%` : "Ready!"}</div>
              <button onClick={() => setScreen("home")} disabled={progress < 100} className="mt-3 w-full py-3 rounded-full text-[14px]" style={{ background: SALMON, color: RICE, fontFamily: "'Poppins', sans-serif", fontWeight: 700, opacity: progress < 100 ? 0.5 : 1 }}>
                Let's begin
              </button>
            </div>
          </div>
        )}

        {screen === "home" && (
          <div className="sd-fade flex flex-col items-center h-full pt-8">
            <div className="w-full px-8">
              <div className="text-[20px]" style={{ color: INK, fontFamily: "'Poppins', sans-serif", fontWeight: 700 }}>What should we eat today?</div>
            </div>

            <div className="relative w-full mt-8" style={{ height: 250 }}>
              {behind.map((f, idx) => <DeckCard key={f.id} food={f} isFront={false} offset={offsets[idx]} onSkip={() => {}} onChoose={() => {}} onFocusStart={() => {}} onFocusEnd={() => {}} onDragState={() => {}} />)}
              {front && <DeckCard key={front.id} food={front} isFront={true} offset={offsets[0]} onSkip={handleSkip} onChoose={handleChoose} onFocusStart={handleFocusStart} onFocusEnd={handleFocusEnd} onDragState={handleDrag} />}
            </div>

            <div className="mt-2"><PhotoDog mood={mood} size={240} /></div>
            <div className="mt-3 text-center px-10"><div className="text-[12px]" style={{ color: MUTE, fontFamily: "'Poppins', sans-serif" }}>{hint}</div></div>
            <div className="flex gap-1.5 mt-4 mb-6">{[0, 1, 2].map((i) => <div key={i} style={{ width: 6, height: 6, borderRadius: "50%", background: i === 0 ? SALMON : "#E3D6BB" }} />)}</div>
          </div>
        )}

        {screen === "focusFood" && selected && (
          <div className="sd-fade flex flex-col items-center h-full px-8 pt-12">
            <div style={{ transform: "scale(1.5)" }}>
              <ClayShell size={116} radius={26}><FoodArt food={selected} size={78} /></ClayShell>
            </div>
            <div className="mt-16"><PhotoDog mood="focus" size={236} /></div>
            <div className="mt-4 text-center">
              <div style={{ fontFamily: "'Poppins', sans-serif", fontWeight: 700, color: INK, fontSize: 17 }}>{selected.lines.focus}</div>
              <div className="text-[13px] mt-1" style={{ color: MUTE, fontFamily: "'Poppins', sans-serif" }}>{selected.name}</div>
              <div className="flex justify-center gap-1 mt-2 text-[16px]">
                {[0, 1, 2, 3, 4].map((i) => <span key={i} style={{ color: i < likeLevel ? SALMON : "#E3D6BB" }}>♥</span>)}
              </div>
            </div>
          </div>
        )}

        {screen === "chooseFood" && selected && (
          <div className="sd-fade flex flex-col items-center h-full px-8 pt-12">
            <div className="w-full text-left">
              <div style={{ fontFamily: "'Poppins', sans-serif", fontWeight: 700, color: INK, fontSize: 20 }}>{selected.lines.like}</div>
            </div>
            <div className="mt-6"><PhotoDog mood="like" size={270} /></div>
            <div className="w-full mt-auto pb-8">
              <button onClick={confirm} className="w-full py-3 rounded-full text-[14px]" style={{ background: SALMON, color: RICE, fontFamily: "'Poppins', sans-serif", fontWeight: 700 }}>
                This is the one!
              </button>
            </div>
          </div>
        )}

        {screen === "result" && selected && (
          <div className="sd-fade flex flex-col items-center h-full px-8 pt-14">
            <div className="relative">
              <div className="absolute inset-0">{Array.from({ length: 12 }).map((_, i) => <Particle key={i} i={i} />)}</div>
              <PhotoDog mood="celebrate" size={280} />
            </div>
            <div className="mt-4 text-center">
              <div style={{ fontFamily: "'Poppins', sans-serif", fontWeight: 700, color: INK, fontSize: 20 }}>Perfect choice!</div>
              <div className="text-[14px] mt-1" style={{ color: MUTE, fontFamily: "'Poppins', sans-serif" }}>Today we eat {selected.name} {selected.emoji}</div>
            </div>
            <button onClick={restart} className="mt-8 w-full py-3 rounded-full text-[13px]" style={{ background: SALMON, color: RICE, fontFamily: "'Poppins', sans-serif", fontWeight: 700 }}>
              Decide again
            </button>
          </div>
        )}
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<SushiDogApp />);
</script>
</body>
</html>
